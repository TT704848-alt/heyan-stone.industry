<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禾硯石業 - 石材估價與電子色版展示</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#33363B',
                            gold: '#E29D29',
                            goldHover: '#c8861d',
                            lightBg: '#F8F9FA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .active-tab {
            border-bottom: 3px solid #E29D29;
            color: #E29D29;
            font-weight: bold;
        }
        .nav-tab-active {
            background-color: #E29D29;
            color: #33363B;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-brand-dark text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-gold rounded flex items-center justify-center text-brand-dark font-black text-xl">禾</div>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">禾硯石業 <span class="text-xs md:text-sm text-gray-300 font-normal">| 石材估價與電子色版展示</span></h1>
            </div>
            <!-- 主頁籤選單 -->
            <nav class="flex space-x-2 text-sm font-medium bg-gray-800 p-1 rounded-lg">
                <button onclick="switchMainTab('estimator')" id="nav-estimator" class="px-4 py-2 rounded-md transition-colors nav-tab-active">線上估價系統</button>
                <button onclick="switchMainTab('gallery')" id="nav-gallery" class="px-4 py-2 rounded-md transition-colors text-gray-300 hover:text-white">實景作品集</button>
                <button onclick="switchMainTab('samples')" id="nav-samples" class="px-4 py-2 rounded-md transition-colors text-gray-300 hover:text-white">電子色版</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- 1. 線上估價系統 Section -->
        <section id="page-estimator" class="page-section bg-white rounded-xl shadow-md p-6 md:p-8">
            <h2 class="text-2xl font-bold border-l-4 border-brand-gold pl-3 mb-6 text-brand-dark">線上石材估價系統</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- 控制面板 -->
                <div class="space-y-6">
                    <div>
                        <label class="block font-medium mb-2">1. 選擇石材材質</label>
                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="selectMaterial('solid-surface', 120)" id="mat-solid-surface" class="mat-btn p-3 border-2 border-brand-gold bg-amber-50 rounded-lg text-center hover:border-brand-gold transition-all">
                                <div class="font-bold">人造石</div>
                                <div class="text-xs text-gray-500">基本款</div>
                            </button>
                            <button onclick="selectMaterial('quartz', 220)" id="mat-quartz" class="mat-btn p-3 border-2 border-gray-200 rounded-lg text-center hover:border-brand-gold transition-all">
                                <div class="font-bold">石英石</div>
                                <div class="text-xs text-gray-500">耐磨抗刮</div>
                            </button>
                            <button onclick="selectMaterial('sintered-stone', 350)" id="mat-sintered-stone" class="mat-btn p-3 border-2 border-gray-200 rounded-lg text-center hover:border-brand-gold transition-all">
                                <div class="font-bold">陶板/薄板</div>
                                <div class="text-xs text-gray-500">頂級耐熱</div>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-medium mb-1">長度 (cm)</label>
                            <input type="number" id="input-length" value="240" oninput="calculatePrice()" class="w-full p-2 border rounded focus:ring-2 focus:ring-brand-gold outline-none">
                        </div>
                        <div>
                            <label class="block font-medium mb-1">深度/寬度 (cm)</label>
                            <input type="number" id="input-width" value="60" oninput="calculatePrice()" class="w-full p-2 border rounded focus:ring-2 focus:ring-brand-gold outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block font-medium mb-2">2. 水槽工法/安裝方式</label>
                        <select id="input-install" onchange="calculatePrice()" class="w-full p-2 border rounded focus:ring-2 focus:ring-brand-gold outline-none">
                            <option value="under">下嵌式 (Under-mount) +$1,500</option>
                            <option value="top">上檯式 (Top-mount) +$800</option>
                            <option value="flush">平接式 (Flush-mount) +$2,500</option>
                        </select>
                    </div>

                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <div class="text-sm text-gray-500">預估總金額 (含基本安裝加工)</div>
                        <div class="text-3xl font-extrabold text-brand-gold mt-1" id="total-price">NT$ 0</div>
                        <div class="text-xs text-gray-400 mt-2">* 實際報價依現場量測與特殊加工費用為準。</div>
                    </div>
                </div>

                <!-- 2D 示意圖 -->
                <div class="flex flex-col items-center justify-center bg-brand-lightBg p-4 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-semibold text-gray-600 mb-2">2D 規格與剖面示意圖</h3>
                    <canvas id="diagramCanvas" width="400" height="280" class="bg-white rounded border shadow-sm max-w-full"></canvas>
                </div>
            </div>
        </section>

        <!-- 2. 實景作品集 Section -->
        <section id="page-gallery" class="page-section hidden bg-white rounded-xl shadow-md p-6 md:p-8">
            <h2 class="text-2xl font-bold border-l-4 border-brand-gold pl-3 mb-6 text-brand-dark">實景作品集</h2>
            <div id="portfolio-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </section>

        <!-- 3. 電子色版 Section -->
        <section id="page-samples" class="page-section hidden bg-white rounded-xl shadow-md p-6 md:p-8">
            <h2 class="text-2xl font-bold border-l-4 border-brand-gold pl-3 mb-6 text-brand-dark">電子色版展示</h2>
            
            <div class="flex border-b border-gray-200 mb-6">
                <button onclick="switchSampleTab('solid-surface')" id="tab-solid-surface" class="px-6 py-2 active-tab">人造石</button>
                <button onclick="switchSampleTab('quartz')" id="tab-quartz" class="px-6 py-2 text-gray-500 hover:text-brand-gold">石英石</button>
                <button onclick="switchSampleTab('sintered-stone')" id="tab-sintered-stone" class="px-6 py-2 text-gray-500 hover:text-brand-gold">陶板</button>
            </div>

            <div id="samples-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </section>

    </main>

    <footer class="bg-brand-dark text-gray-400 text-center py-6 mt-12 text-sm border-t border-gray-700">
        <p>© 禾硯石業 HEYAN Inc. All Rights Reserved.</p>
    </footer>

    <script>
        let currentUnitPrice = 120;
        let currentMaterial = 'solid-surface';

        // 🎯 在這裡直接設定你有的圖片數量（只讀取有的檔案，不會請求錯誤路徑刷爆 GitHub）
        const portfolioCount = 6; // 作品集有 1.jpg ~ 6.jpg

        // 各材質與資料夾擁有的圖片數量或清單
        const sampleData = {
            'solid-surface': [
                // 如果有子資料夾，寫法如： { folder: 'EG半版', count: 10 }
                { folder: '', count: 10 } 
            ],
            'quartz': [
                { folder: '', count: 10 }
            ],
            'sintered-stone': [
                { folder: '', count: 6 },
                { folder: 'EG半版', count: 6 },
                { folder: 'MQ半版', count: 6 },
                { folder: 'QJ半版', count: 6 }
            ]
        };

        function switchMainTab(tabName) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.add('hidden'));
            const targetSection = document.getElementById(`page-${tabName}`);
            if (targetSection) targetSection.classList.remove('hidden');

            ['estimator', 'gallery', 'samples'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                if (navBtn) {
                    navBtn.className = (t === tabName) 
                        ? 'px-4 py-2 rounded-md transition-colors nav-tab-active'
                        : 'px-4 py-2 rounded-md transition-colors text-gray-300 hover:text-white';
                }
            });

            if (tabName === 'gallery') loadPortfolio();
            if (tabName === 'samples') loadSamples('solid-surface');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectMaterial(mat, price) {
            currentMaterial = mat;
            currentUnitPrice = price;
            
            document.querySelectorAll('.mat-btn').forEach(btn => {
                btn.classList.remove('border-brand-gold', 'bg-amber-50');
                btn.classList.add('border-gray-200');
            });
            const activeBtn = document.getElementById(`mat-${mat}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-gray-200');
                activeBtn.classList.add('border-brand-gold', 'bg-amber-50');
            }

            calculatePrice();
        }

        function calculatePrice() {
            const length = parseFloat(document.getElementById('input-length').value) || 0;
            const width = parseFloat(document.getElementById('input-width').value) || 0;
            const installType = document.getElementById('input-install').value;

            let installFee = 1500;
            if (installType === 'top') installFee = 800;
            if (installType === 'flush') installFee = 2500;

            const areaCm2 = length * width;
            const totalPrice = Math.round((areaCm2 * currentUnitPrice * 0.1) + installFee);

            document.getElementById('total-price').innerText = `NT$ ${totalPrice.toLocaleString()}`;
            drawDiagram(length, width, installType);
        }

        function drawDiagram(l, w, install) {
            const canvas = document.getElementById('diagramCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#33363B';
            ctx.lineWidth = 2;
            ctx.strokeRect(50, 40, 300, 120);
            ctx.fillStyle = '#E29D29';
            ctx.font = '12px sans-serif';
            ctx.fillText(`${l} cm`, 180, 30);
            ctx.fillText(`${w} cm`, 355, 105);

            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(120, 70, 160, 60);
            ctx.setLineDash([]);
            ctx.fillText(`安裝工法: ${install.toUpperCase()}`, 130, 105);
        }

        function switchSampleTab(type) {
            ['solid-surface', 'quartz', 'sintered-stone'].forEach(t => {
                const tab = document.getElementById(`tab-${t}`);
                if (tab) tab.className = t === type ? 'px-6 py-2 active-tab' : 'px-6 py-2 text-gray-500 hover:text-brand-gold';
            });
            loadSamples(type);
        }

        // 載入作品集圖片
        function loadPortfolio() {
            const container = document.getElementById('portfolio-container');
            container.innerHTML = '';

            for (let i = 1; i <= portfolioCount; i++) {
                const imgPath = `images/portfolio/${i}.jpg`;
                const div = document.createElement('div');
                div.className = 'overflow-hidden rounded-lg shadow border border-gray-100 hover:shadow-lg transition-shadow bg-gray-50';
                div.innerHTML = `<img src="${imgPath}" class="w-full h-56 object-cover hover:scale-105 transition-transform duration-300" alt="作品 ${i}">`;
                container.appendChild(div);
            }
        }

        // 載入電子色版圖片
        function loadSamples(type) {
            const container = document.getElementById('samples-container');
            container.innerHTML = '';

            const groups = sampleData[type] || [];
            groups.forEach(group => {
                const folderPath = group.folder ? `${encodeURIComponent(group.folder)}/` : '';
                for (let i = 1; i <= group.count; i++) {
                    const imgPath = `images/color-samples/${type}/${folderPath}${i}.jpg`;
                    const labelText = group.folder ? `${group.folder} - 款式 ${i}` : `樣品款 ${i}`;
                    
                    const div = document.createElement('div');
                    div.className = 'overflow-hidden rounded-lg shadow border border-gray-100 bg-white p-2 text-center';
                    div.innerHTML = `
                        <img src="${imgPath}" class="w-full h-36 object-cover rounded mb-2" alt="${labelText}">
                        <span class="text-xs text-gray-600 font-medium truncate block" title="${labelText}">${labelText}</span>
                    `;
                    container.appendChild(div);
                }
            });
        }

        // 初始化
        selectMaterial('solid-surface', 120);
    </script>
</body>
</html>
